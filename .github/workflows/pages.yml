name: Publish GATE Studio
on:
  push:
    branches: [main]
    paths: ['gate-frontend/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gate-frontend/package-lock.json
      - run: npm ci
        working-directory: gate-frontend
      - run: npm run build
        working-directory: gate-frontend
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: gate-frontend/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
